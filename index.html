<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPB 次戦勝利確率 予想ダッシュボード</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-sub: #718096;
      --home-color: #3182ce;
      --away-color: #e53e3e;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 16px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    #date-display {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .team-box {
      flex: 1;
    }

    .team-box.away {
      text-align: left;
    }

    .team-box.home {
      text-align: right;
    }

    .team-name {
      font-size: 1.25rem;
      font-weight: 700;
      display: block;
    }

    .team-role {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .starter {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .vs {
      font-size: 0.9rem;
      font-weight: 700;
      color: #a0aec0;
      padding: 0 10px;
    }

    .rate-labels {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .rate-labels .away-val {
      color: var(--away-color);
    }

    .rate-labels .home-val {
      color: var(--home-color);
    }

    .gauge-wrapper {
      height: 12px;
      background-color: #edf2f7;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
    }

    .bar-away {
      background-color: var(--away-color);
      height: 100%;
      transition: width 0.6s ease;
    }

    .bar-home {
      background-color: var(--home-color);
      height: 100%;
      transition: width 0.6s ease;
    }

    .loading, .error-msg {
      text-align: center;
      padding: 30px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <header>
    <h1>NPB 次戦勝利確率</h1>
    <p id="date-display">データを読み込み中...</p>
  </header>

  <main class="container" id="matchups-container">
    <div class="loading">最新の予想データを取得しています...</div>
  </main>

  <script>
    async function loadPredictions() {
      const container = document.getElementById('matchups-container');
      const dateDisplay = document.getElementById('date-display');

      try {
        // キャッシュを防ぐためURLの末尾に現在のタイムスタンプを付与
        const cacheBuster = new Date().getTime();
        const response = await fetch(`prediction.json?t=${cacheBuster}`);
        
        if (!response.ok) {
          throw new Error('データの読み込みに失敗しました');
        }

        const data = await response.json();

        // 日付の反映
        dateDisplay.textContent = `対象日: ${data.date}（予告先発・ピタゴラス勝率・FIP補正）`;
        container.innerHTML = '';

        if (!data.matchups || data.matchups.length === 0) {
          container.innerHTML = '<div class="loading">本日の対象試合はありません。</div>';
          return;
        }

        // 各対戦カードの要素を生成
        data.matchups.forEach(m => {
          const awayPercent = Math.round(m.away_win_rate * 1000) / 10;
          const homePercent = Math.round(m.home_win_rate * 1000) / 10;

          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML = `
            <div class="card-header">
              <div class="team-box away">
                <div class="team-role">ビジター</div>
                <span class="team-name">${m.away_team}</span>
                <div class="starter">先発: ${m.away_starter}</div>
              </div>
              <div class="vs">VS</div>
              <div class="team-box home">
                <div class="team-role">ホーム</div>
                <span class="team-name">${m.home_team}</span>
                <div class="starter">先発: ${m.home_starter}</div>
              </div>
            </div>

            <div class="rate-labels">
              <span class="away-val">${awayPercent}%</span>
              <span class="home-val">${homePercent}%</span>
            </div>

            <div class="gauge-wrapper">
              <div class="bar-away" style="width: ${awayPercent}%"></div>
              <div class="bar-home" style="width: ${homePercent}%"></div>
            </div>
          `;

          container.appendChild(card);
        });

      } catch (error) {
        dateDisplay.textContent = '取得エラー';
        container.innerHTML = `
          <div class="card error-msg">
            <p>予想データの表示に失敗しました。</p>
            <p style="font-size: 0.8rem; margin-top: 6px;">prediction.json が正しく生成されているか確認してください。</p>
          </div>
        `;
      }
    }

    // 画面を開いた時に実行
    loadPredictions();
  </script>
</body>
</html>
