name: NPB Standings and Clinch Numbers

on:
  schedule:
    # 毎日 日本時間 22:30 (UTC 13:30) に自動実行
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-standings:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 順位表・クリンチナンバー計算実行
        run: |
          python standings_calc.py

      - name: 結果を自動コミット＆プッシュ
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update standings: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
