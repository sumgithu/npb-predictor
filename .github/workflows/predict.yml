name: NPB Daily Prediction Pipeline

on:
  schedule:
    # 日本時間 17:15（UTC 08:15）に自動実行
    - cron: '15 8 * * *'
  # GitHub上の「Run workflow」ボタンから手動実行も可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-prediction:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 numpy

      - name: 予測スクリプトの実行
        run: |
          python predict.py

      - name: 生成されたJSONをGitHubリポジトリへ自動コミット＆プッシュ
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prediction.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prediction: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
