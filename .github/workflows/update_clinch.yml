name: NPB Predictor Engine Run

on:
  schedule:
    # 毎日定期実行（日本時間 6:00, 22:00, 23:30）
    - cron: '0 21 * * *'
    - cron: '0 13 * * *'
    - cron: '30 14 * * *'

  # 手動実行
  workflow_dispatch:

  # 指定ファイルがmainにpushされたとき
  push:
    branches:
      - main
    paths:
      - '2016-2026プロ野球レギュラーシーズン結果.txt'
      - 'games_db.json'
      - 'clinch_engine.py'
      - 'convert_log.py'

# 同じWorkflowが同時に複数走らないようにする
concurrency:
  group: npb-predictor-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate and Push Results Safely
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAX_RETRIES=5

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "========================================"
            echo "Attempt ${attempt}/${MAX_RETRIES}"
            echo "========================================"

            # 最新のmainを取得
            git fetch origin main

            # GitHub上の最新mainを作業ツリーに反映
            # ここで一度リセットしてから再計算することが重要
            git reset --hard origin/main

            echo "Current commit:"
            git rev-parse HEAD

            echo ""
            echo "Running convert_log.py ..."

            if [ -f convert_log.py ]; then
              python convert_log.py
            fi

            echo ""
            echo "Running clinch_engine.py ..."

            python clinch_engine.py

            echo ""
            echo "Checking generated files ..."

            git add npb_games_clean.csv history_standings.json

            # 変更がなければ終了
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            echo ""
            echo "Committing changes ..."

            git commit -m "Auto update standings and clean CSV [skip ci]"

            echo ""
            echo "Attempting push ..."

            if git push origin HEAD:main; then
              echo ""
              echo "Push succeeded."
              exit 0
            fi

            echo ""
            echo "Push failed because remote main advanced."
            echo "The latest main will be fetched and the engine will be run again."

            # 次の試行前に少し待つ
            sleep 2
          done

          echo ""
          echo "Push failed after ${MAX_RETRIES} attempts."
          exit 1
