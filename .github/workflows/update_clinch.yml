name: NPB Predictor Engine Run

on:
  schedule:
    # 毎日定期実行（日本時間 6:00, 22:00, 23:30）
    - cron: '0 21 * * *'
    - cron: '0 13 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch: # 手動実行トリガー
  push:
    paths:
      - '2016-2026プロ野球レギュラーシーズン結果.txt'
      - 'games_db.json'
      - 'clinch_engine.py'
      - 'convert_log.py'

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Convert Raw Log to Clean CSV
        run: python convert_log.py

      - name: Run Clinch Engine
        run: python clinch_engine.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add npb_games_clean.csv history_standings.json games_db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update standings and clean CSV [skip ci]" && git push)
