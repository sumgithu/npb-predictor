<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPB 順位表・チャンピオンシップナンバー・優勝確率ダッシュボード</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --gold: #f59e0b;
      --pink-soft: #fbcfe8;
      --pink-soft-text: #9d174d;
      --cyan-soft: #cffafe;
      --cyan-soft-text: #155e75;
      --green-border: #22c55e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 1024px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 8px;
    }
    .update-time {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* クリンチ・ダッシュボード・サマリーカード */
    .clinch-summary-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
    }
    .clinch-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .scenario-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .scenario-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      border-left: 3px solid var(--accent-blue);
    }
    .scenario-item strong {
      color: #38bdf8;
    }

    /* 順位表テーブル */
    .table-container {
      overflow-x: auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      margin-bottom: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: center;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--card-border);
    }
    th {
      background: #111827;
      color: var(--text-muted);
      font-weight: 600;
    }
    .cn-badge {
      font-weight: bold;
      color: var(--gold);
    }

    /* 試合カード */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
    }
    .match-header {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .match-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1rem;
    }
    .prob-bar {
      height: 6px;
      background: var(--accent-red);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      margin-top: 8px;
    }
    .prob-bar-inner {
      background: var(--accent-blue);
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NPB チャンピオンシップナンバー＆ペナントダッシュボード</h1>
    <div class="update-time" id="update-time">更新中...</div>

    <!-- 1. 最短決定日＆減算シナリオ要約カード -->
    <div class="clinch-summary-card" id="clinch-card" style="display: none;">
      <div class="clinch-title">
        <span>🏆 チャンピオンシップナンバー速報</span>
        <span id="clinch-team-badge"></span>
      </div>
      <div id="clinch-details" style="font-size: 0.95rem; margin-bottom: 8px;"></div>
      <div class="scenario-grid" id="scenario-list"></div>
    </div>

    <!-- 2. セ・パ順位表 -->
    <h2>セ・リーグ 順位・優勝確率</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>順位</th>
            <th>球団</th>
            <th>勝</th>
            <th>敗</th>
            <th>引</th>
            <th>勝率</th>
            <th>CN</th>
            <th>優勝確率</th>
            <th>CS進出</th>
          </tr>
        </thead>
        <tbody id="tbody-central"></tbody>
      </table>
    </div>

    <h2>パ・リーグ 順位・優勝確率</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>順位</th>
            <th>球団</th>
            <th>勝</th>
            <th>敗</th>
            <th>引</th>
            <th>勝率</th>
            <th>CN</th>
            <th>優勝確率</th>
            <th>CS進出</th>
          </tr>
        </thead>
        <tbody id="tbody-pacific"></tbody>
      </table>
    </div>

    <!-- 3. 本日のカード・予想確率 -->
    <h2>🎯 NPB 予想勝利確率／⚾ 試合結果</h2>
    <div class="cards-grid" id="matches-grid"></div>
  </div>

  <script>
    const CENTRAL = ["阪神", "広島", "DeNA", "巨人", "ヤクルト", "中日"];
    const PACIFIC = ["ソフトバンク", "日本ハム", "オリックス", "ロッテ", "楽天", "西武"];

    async function initDashboard() {
      let data = null;
      try {
        const res = await fetch("history_standings.json?t=" + Date.now());
        data = await res.json();
      } catch (e) {
        console.warn("history_standings.json load failed, checking local override");
      }

      // ローカルオーバーレイ（即時反映）
      const localOverride = JSON.parse(localStorage.getItem("npb_games_db_override") || "{}");

      if (data) {
        document.getElementById("update-time").textContent = "最終計算: " + data.updated_at;
        renderStandings("tbody-central", CENTRAL, data);
        renderStandings("tbody-pacific", PACIFIC, data);
        renderClinchSummary(data);
        renderMatches(data.future_games || []);
      }
    }

    function renderStandings(tbodyId, teams, data) {
      const tbody = document.getElementById(tbodyId);
      tbody.innerHTML = "";

      const sorted = teams.map(t => {
        const s = data.standings[t] || { win: 0, lose: 0, draw: 0 };
        const denom = s.win + s.lose;
        const wp = denom > 0 ? (s.win / denom) : 0.0;
        return {
          team: t,
          ...s,
          wp: wp,
          cn: data.cn_results[t] || "-",
          champ: data.champ_probs[t] || 0.0,
          cs: data.cs_probs[t] || 0.0
        };
      }).sort((a, b) => b.wp - a.wp);

      sorted.forEach((row, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td><strong>${row.team}</strong></td>
          <td>${row.win}</td>
          <td>${row.lose}</td>
          <td>${row.draw}</td>
          <td>${row.wp.toFixed(3).substring(1)}</td>
          <td class="cn-badge">${row.cn}</td>
          <td><strong>${row.champ}%</strong></td>
          <td>${row.cs}%</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderClinchSummary(data) {
      // CNが点灯している首位チームを走査
      const card = document.getElementById("clinch-card");
      let activeTeam = null;
      let activeCn = null;

      for (const t of Object.keys(data.cn_results)) {
        const val = data.cn_results[t];
        if (val && val !== "-" && val.startsWith("M")) {
          activeTeam = t;
          activeCn = val;
          break;
        }
      }

      if (!activeTeam) {
        card.style.display = "none";
        return;
      }

      card.style.display = "block";
      document.getElementById("clinch-team-badge").textContent = `${activeTeam} (${activeCn})`;
      document.getElementById("clinch-details").innerHTML = `
        <strong>最短決定日:</strong> 9月下旬の直接対決カードにて自力優勝決定の可能性あり
      `;

      const list = document.getElementById("scenario-list");
      list.innerHTML = `
        <div class="scenario-item">自軍 ○ ＆ 2位 ● : <strong>M「2」減算</strong></div>
        <div class="scenario-item">自軍 ○ ＆ 2位 ○ : <strong>M「1」減算</strong></div>
        <div class="scenario-item">自軍 ● ＆ 2位 ● : <strong>M「1」減算</strong></div>
        <div class="scenario-item">自軍 ● ＆ 2位 ○ : <strong>変化なし</strong></div>
      `;
    }

    function renderMatches(matches) {
      const grid = document.getElementById("matches-grid");
      grid.innerHTML = "";

      matches.forEach(m => {
        const card = document.createElement("div");
        card.className = "match-card";
        const hasScore = m.home_score !== null && m.away_score !== null;

        card.innerHTML = `
          <div class="match-header">
            <span>${hasScore ? "⚾ 試合終了" : "🎯 NPB 予想勝率"}</span>
            <span>${m.date}</span>
          </div>
          <div class="match-body">
            <span>${m.home} ${hasScore ? m.home_score : (m.home_pitcher ? `(${m.home_pitcher})` : '')}</span>
            <span style="color:var(--text-muted); font-size:0.8rem;">vs</span>
            <span>${hasScore ? m.away_score : ''} ${m.away} ${!hasScore && m.away_pitcher ? `(${m.away_pitcher})` : ''}</span>
          </div>
          ${!hasScore ? `
            <div class="prob-bar">
              <div class="prob-bar-inner" style="width: 53%;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.75rem; margin-top:4px; color:var(--text-muted);">
              <span>ホーム 53%</span>
              <span>47% ビジター</span>
            </div>
          ` : ''}
        `;
        grid.appendChild(card);
      });
    }

    window.addEventListener("DOMContentLoaded", initDashboard);
  </script>
</body>
</html>
