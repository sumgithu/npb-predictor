<body>

<div class="container">

  <header>
    <h1>⚾ NPB 試合結果・先発 手動管理ダッシュボード</h1>
  </header>

  <div class="config-box">

    <div class="config-grid">

      <div class="form-group">
        <label for="repo-name">リポジトリ名（例: user/repo）</label>
        <input
          type="text"
          id="repo-name"
          placeholder="sumgithu/npb-predictor"
        >
      </div>

      <div class="form-group">
        <label for="gh-token">GitHub Personal Access Token</label>
        <input
          type="password"
          id="gh-token"
          placeholder="Fine-grained PAT"
          autocomplete="off"
        >
      </div>

    </div>

    <div class="info-box">
      PATはこの画面ではlocalStorageに保存しません。
      このタブでの利用中のみ保持します。
      GitHub側では、可能な限り対象リポジトリだけに限定したFine-grained tokenを使用してください。
    </div>

  </div>

  <div class="toolbar">

    <div class="date-control">
      <label for="target-date">入力対象日:</label>
      <input type="date" id="target-date">
    </div>

    <button
      class="btn btn-secondary"
      onclick="loadGamesForDate()"
    >
      日程を再読込
    </button>

  </div>

  <div id="db-info"></div>

  <div id="games-container"></div>

  <button
    class="btn btn-secondary"
    style="width:100%; margin-top:10px;"
    onclick="addNewGameCard()"
  >
    ＋ 対戦カードを追加
  </button>

  <button
    class="btn btn-save"
    onclick="saveToGitHub()"
  >
    データベースを更新保存
  </button>

  <div id="status-msg" class="status-msg"></div>

</div>

<script>
  const TEAMS = [
    "阪神", "巨人", "ＤｅＮＡ", "ヤクルト", "中日", "広島",
    "ソフトバンク", "日本ハム", "ロッテ", "楽天", "オリックス", "西武"
  ];

  let fullDbPayload = null;
  let gamesList = [];
  let sha = null;

  // ------------------------------------------------------------
  // JST
  // ------------------------------------------------------------

  function getJstDateString() {
    return new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }
    ).format(new Date());
  }

  // ------------------------------------------------------------
  // UTF-8 / Base64
  // ------------------------------------------------------------

  function decodeBase64Utf8(base64) {
    const binary = atob(base64);
    const bytes = Uint8Array.from(
      binary,
      c => c.charCodeAt(0)
    );
    return new TextDecoder('utf-8').decode(bytes);
  }

  function encodeUtf8Base64(text) {
    const bytes = new TextEncoder().encode(text);
    let binary = '';

    const chunkSize = 0x8000;

    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode(
        ...bytes.subarray(i, i + chunkSize)
      );
    }

    return btoa(binary);
  }

  // ------------------------------------------------------------
  // Status
  // ------------------------------------------------------------

  function setStatus(message, type = '') {
    const el = document.getElementById('status-msg');
    el.textContent = message;
    el.className = `status-msg ${type}`;
  }

  // ------------------------------------------------------------
  // Initialization
  // ------------------------------------------------------------

  async function init() {
    document.getElementById('repo-name').value =
      localStorage.getItem('npb_admin_repo') || '';

    // PATはlocalStorageには保存しない。
    document.getElementById('gh-token').value =
      sessionStorage.getItem('npb_admin_token') || '';

    document.getElementById('target-date').value =
      getJstDateString();

    document
      .getElementById('target-date')
      .addEventListener(
        'change',
        () => renderGamesForTargetDate()
      );

    const repo =
      document.getElementById('repo-name').value.trim();

    if (repo) {
      await fetchCurrentDb();
    } else {
      renderDbInfo();
    }
  }

  // ------------------------------------------------------------
  // GitHub API
  // ------------------------------------------------------------

  function getRepoAndToken() {
    return {
      repo:
        document
          .getElementById('repo-name')
          .value
          .trim(),

      token:
        document
          .getElementById('gh-token')
          .value
          .trim()
    };
  }

  function buildGithubHeaders(token) {
    const headers = {
      'Accept': 'application/vnd.github.v3+json'
    };

    if (token) {
      headers['Authorization'] =
        `Bearer ${token}`;
    }

    return headers;
  }

  async function fetchCurrentDb() {
    const { repo, token } =
      getRepoAndToken();

    if (!repo) {
      setStatus(
        'リポジトリ名を入力してください。',
        'warning'
      );
      return;
    }

    localStorage.setItem(
      'npb_admin_repo',
      repo
    );

    if (token) {
      sessionStorage.setItem(
        'npb_admin_token',
        token
      );
    }

    const url =
      `https://api.github.com/repos/${repo}/contents/games_db.json`;

    const headers =
      buildGithubHeaders(token);

    try {
      setStatus('DBを読み込み中...');

      const res = await fetch(
        url,
        {
          headers,
          cache: 'no-store'
        }
      );

      if (!res.ok) {
        throw new Error(
          `DB取得失敗（HTTP ${res.status}）`
        );
      }

      const data =
        await res.json();

      sha = data.sha;

      const decoded =
        decodeBase64Utf8(
          data.content.replace(/\n/g, '')
        );

      fullDbPayload =
        JSON.parse(decoded);

      gamesList =
        Array.isArray(fullDbPayload)
          ? fullDbPayload
          : (
              Array.isArray(fullDbPayload.games)
                ? fullDbPayload.games
                : []
            );

      renderDbInfo();
      renderGamesForTargetDate();

      setStatus(
        'DBを読み込みました。',
        'success'
      );

    } catch (err) {
      renderDbInfo();

      setStatus(
        `DBの取得に失敗しました。${err.message || ''}`,
        'error'
      );
    }
  }

  async function refreshShaBeforeSave() {
    const { repo, token } =
      getRepoAndToken();

    const url =
      `https://api.github.com/repos/${repo}/contents/games_db.json`;

    const res = await fetch(
      url,
      {
        headers: buildGithubHeaders(token),
        cache: 'no-store'
      }
    );

    if (!res.ok) {
      throw new Error(
        `保存前のDB再取得に失敗しました（HTTP ${res.status}）`
      );
    }

    const data =
      await res.json();

    sha = data.sha;
    return data;
  }

  // ------------------------------------------------------------
  // DB information
  // ------------------------------------------------------------

  function renderDbInfo() {
    const container =
      document.getElementById('db-info');

    container.innerHTML = `
      <div class="db-info">
        <div class="db-info-item">
          <span class="db-info-label">登録件数</span>
          <span class="db-info-value">
            ${gamesList.length}件
          </span>
        </div>

        <div class="db-info-item">
          <span class="db-info-label">対象日登録件数</span>
          <span class="db-info-value">
            ${
              gamesList.filter(
                g =>
                  g.date ===
                  document.getElementById('target-date').value
              ).length
            }件
          </span>
        </div>
      </div>
    `;
  }

  // ------------------------------------------------------------
  // Date / game rendering
  // ------------------------------------------------------------

  function loadGamesForDate() {
    const { repo } =
      getRepoAndToken();

    if (!repo) {
      alert('リポジトリ名を入力してください。');
      return;
    }

    fetchCurrentDb();
  }

  function renderGamesForTargetDate() {
    const container =
      document.getElementById(
        'games-container'
      );

    container.innerHTML = '';

    const targetDate =
      document.getElementById(
        'target-date'
      ).value;

    const dayGames =
      gamesList.filter(
        g => g.date === targetDate
      );

    if (dayGames.length === 0) {
      container.innerHTML = `
        <div
          style="
            text-align:center;
            padding:24px;
            color:#64748b;
            background:#fff;
            border-radius:8px;
            border:1px solid #e2e8f0;
          "
        >
          この日の登録データはありません。
          「＋ 対戦カードを追加」から作成できます。
        </div>
      `;

      renderDbInfo();
      return;
    }

    dayGames.forEach(
      g => {
        container.appendChild(
          createGameCardElement(g)
        );
      }
    );

    renderDbInfo();
  }

  function createTeamOptions(selected) {
    return TEAMS.map(
      t => `
        <option
          value="${escapeHtmlAttribute(t)}"
          ${t === selected ? 'selected' : ''}
        >
          ${escapeHtmlText(t)}
        </option>
      `
    ).join('');
  }

  function escapeHtmlText(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function escapeHtmlAttribute(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function createGameCardElement(g) {
    const card =
      document.createElement('div');

    card.className = 'game-card';

    const isCancelled =
      g.status === 'cancelled';

    const hs =
      g.home_score !== null &&
      g.home_score !== undefined
        ? g.home_score
        : '';

    const as_ =
      g.away_score !== null &&
      g.away_score !== undefined
        ? g.away_score
        : '';

    const homeStarter =
      g.home_starter &&
      g.home_starter !== '未定'
        ? g.home_starter
        : '';

    const awayStarter =
      g.away_starter &&
      g.away_starter !== '未定'
        ? g.away_starter
        : '';

    card.innerHTML = `
      <button
        class="del-btn"
        onclick="removeCard(this)"
        title="このカードを削除"
      >
        ✕
      </button>

      <label class="cancel-check">
        <input
          type="checkbox"
          class="is-cancelled"
          ${isCancelled ? 'checked' : ''}
          onchange="toggleCancel(this)"
        >
        雨天等中止
      </label>

      <div class="game-row">

        <div class="team-select-box">

          <div
            style="
              font-size:0.75rem;
              color:#64748b;
              font-weight:700;
              margin-bottom:2px;
            "
          >
            ホーム
          </div>

          <select
            class="home-team"
            style="width:100%;"
          >
            ${createTeamOptions(g.home)}
          </select>

        </div>

        <div class="score-input-box">

          <input
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            class="score-input home-score"
            value="${escapeHtmlAttribute(hs)}"
            placeholder="点"
            ${isCancelled ? 'disabled' : ''}
          >

          <span
            style="
              font-weight:800;
              color:#94a3b8;
            "
          >
            vs
          </span>

          <input
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            class="score-input away-score"
            value="${escapeHtmlAttribute(as_)}"
            placeholder="点"
            ${isCancelled ? 'disabled' : ''}
          >

        </div>

        <div
          class="team-select-box"
          style="text-align:right;"
        >

          <div
            style="
              font-size:0.75rem;
              color:#64748b;
              font-weight:700;
              margin-bottom:2px;
            "
          >
            ビジター
          </div>

          <select
            class="away-team"
            style="width:100%;"
          >
            ${createTeamOptions(g.away)}
          </select>

        </div>

      </div>

      <div class="starter-row">

        <div class="form-group">

          <div class="starter-label">
            ホーム先発
          </div>

          <input
            type="text"
            class="home-starter"
            value="${escapeHtmlAttribute(homeStarter)}"
            placeholder="先発投手名"
          >

        </div>

        <div class="form-group">

          <div class="starter-label">
            ビジター先発
          </div>

          <input
            type="text"
            class="away-starter"
            value="${escapeHtmlAttribute(awayStarter)}"
            placeholder="先発投手名"
          >

        </div>

      </div>

      <div class="info-box">
        ※ここに入力する投手名は<strong>先発投手</strong>です。
        勝利投手・敗戦投手を入力する欄ではありません。
        先発情報が未確認なら空欄のままで構いません。
      </div>
    `;

    return card;
  }

  // ------------------------------------------------------------
  // Card operations
  // ------------------------------------------------------------

  function toggleCancel(el) {
    const card =
      el.closest('.game-card');

    const inputs =
      card.querySelectorAll(
        '.score-input'
      );

    inputs.forEach(
      inp => {
        inp.disabled = el.checked;
      }
    );
  }

  function removeCard(el) {
    if (
      !confirm(
        'この対戦カードを削除しますか？'
      )
    ) {
      return;
    }

    el.closest(
      '.game-card'
    ).remove();
  }

  function addNewGameCard() {
    const container =
      document.getElementById(
        'games-container'
      );

    const emptyGame = {
      home: '阪神',
      away: '巨人',
      home_score: null,
      away_score: null,
      home_starter: '',
      away_starter: '',
      status: 'scheduled'
    };

    container.appendChild(
      createGameCardElement(
        emptyGame
      )
    );
  }

  // ------------------------------------------------------------
  // Validation
  // ------------------------------------------------------------

  function parseScore(value, label) {
    if (value === '') {
      return null;
    }

    if (!/^\d+$/.test(value)) {
      throw new Error(
        `${label}は0以上の整数で入力してください。`
      );
    }

    const num =
      Number(value);

    if (!Number.isSafeInteger(num)) {
      throw new Error(
        `${label}の値が大きすぎます。`
      );
    }

    return num;
  }

  function validateCards(cards) {
    const seen =
      new Set();

    cards.forEach(
      (g, index) => {

        if (!TEAMS.includes(g.home)) {
          throw new Error(
            `${index + 1}試合目：ホーム球団が不正です。`
          );
        }

        if (!TEAMS.includes(g.away)) {
          throw new Error(
            `${index + 1}試合目：ビジター球団が不正です。`
          );
        }

        if (g.home === g.away) {
          throw new Error(
            `${index + 1}試合目：同一球団同士になっています。`
          );
        }

        const key =
          `${g.home}|${g.away}`;

        if (seen.has(key)) {
          throw new Error(
            `${index + 1}試合目：同じ対戦カードが重複しています。`
          );
        }

        seen.add(key);

        if (
          g.status === 'finished' &&
          (
            g.home_score === null ||
            g.away_score === null
          )
        ) {
          throw new Error(
            `${index + 1}試合目：試合終了なのに得点がありません。`
          );
        }

        if (
          g.status !== 'cancelled' &&
          (
            g.home_score !== null &&
            g.away_score !== null
          )
        ) {
          if (
            !Number.isInteger(g.home_score) ||
            !Number.isInteger(g.away_score) ||
            g.home_score < 0 ||
            g.away_score < 0
          ) {
            throw new Error(
              `${index + 1}試合目：得点が不正です。`
            );
          }
        }
      }
    );
  }

  // ------------------------------------------------------------
  // Save
  // ------------------------------------------------------------

  async function saveToGitHub() {
    const { repo, token } =
      getRepoAndToken();

    const targetDate =
      document.getElementById(
        'target-date'
      ).value;

    if (!repo) {
      alert(
        'リポジトリ名を入力してください。'
      );
      return;
    }

    if (!token) {
      alert(
        'GitHub Personal Access Tokenを入力してください。'
      );
      return;
    }

    if (!targetDate) {
      alert(
        '入力対象日を指定してください。'
      );
      return;
    }

    localStorage.setItem(
      'npb_admin_repo',
      repo
    );

    sessionStorage.setItem(
      'npb_admin_token',
      token
    );

    const cards =
      document.querySelectorAll(
        '.game-card'
      );

    const updatedDayGames = [];

    try {

      cards.forEach(
        (c) => {
          const home =
            c.querySelector(
              '.home-team'
            ).value;

          const away =
            c.querySelector(
              '.away-team'
            ).value;

          const isCancelled =
            c.querySelector(
              '.is-cancelled'
            ).checked;

          const hsRaw =
            c.querySelector(
              '.home-score'
            ).value.trim();

          const asRaw =
            c.querySelector(
              '.away-score'
            ).value.trim();

          const hStart =
            c.querySelector(
              '.home-starter'
            ).value.trim();

          const aStart =
            c.querySelector(
              '.away-starter'
            ).value.trim();

          let status =
            'scheduled';

          let hs = null;
          let as_ = null;

          if (isCancelled) {
            status = 'cancelled';

          } else {
            hs =
              parseScore(
                hsRaw,
                'ホーム得点'
              );

            as_ =
              parseScore(
                asRaw,
                'ビジター得点'
              );

            if (
              hs !== null &&
              as_ !== null
            ) {
              status = 'finished';
            }
          }

          updatedDayGames.push({
            date: targetDate,
            home,
            away,
            home_score: hs,
            away_score: as_,
            home_starter:
              hStart || '未定',
            away_starter:
              aStart || '未定',

            /*
              home_pitcher / away_pitcher は
              既存clinch_engine.pyとの互換性のため残す。
              ただし、ここでは必ず先発投手名を入れる。
            */
            home_pitcher:
              hStart || '未定',
            away_pitcher:
              aStart || '未定',

            status
          });
        }
      );

      validateCards(
        updatedDayGames
      );

      /*
        現在の日付分だけ完全に置換する。
        それ以外の日付については既存DBを維持する。
      */
      const otherGames =
        gamesList.filter(
          g => g.date !== targetDate
        );

      const newAllGames =
        otherGames.concat(
          updatedDayGames
        );

      newAllGames.sort(
        (a, b) =>
          a.date.localeCompare(b.date) ||
          a.home.localeCompare(b.home) ||
          a.away.localeCompare(b.away)
      );

      const payloadObj =
        Array.isArray(fullDbPayload)
          ? newAllGames
          : {
              games: newAllGames
            };

      const contentStr =
        JSON.stringify(
          payloadObj,
          null,
          2
        );

      const encoded =
        encodeUtf8Base64(
          contentStr
        );

      setStatus(
        '保存前にGitHub上の最新版を確認しています...'
      );

      /*
        古いSHAで上書きしないため、
        保存直前に最新SHAを取得。
      */
      await refreshShaBeforeSave();

      setStatus(
        'GitHubへ保存中...'
      );

      const url =
        `https://api.github.com/repos/${repo}/contents/games_db.json`;

      const body = {
        message:
          `Update results/starters for ${targetDate}`,
        content: encoded
      };

      if (sha) {
        body.sha = sha;
      }

      const res =
        await fetch(
          url,
          {
            method: 'PUT',
            headers: {
              ...buildGithubHeaders(token),
              'Content-Type':
                'application/json'
            },
            body:
              JSON.stringify(body)
          }
        );

      if (!res.ok) {
        const errData =
          await res.json()
            .catch(() => ({}));

        throw new Error(
          errData.message ||
          `更新失敗（HTTP ${res.status}）`
        );
      }

      const resData =
        await res.json();

      sha =
        resData.content?.sha ||
        resData.commit?.sha ||
        sha;

      fullDbPayload =
        payloadObj;

      gamesList =
        newAllGames;

      renderGamesForTargetDate();
      renderDbInfo();

      setStatus(
        `保存完了！（${targetDate} のデータを更新しました。GitHub Actionsが実行されます）`,
        'success'
      );

    } catch (err) {

      setStatus(
        `保存エラー：${err.message || err}`,
        'error'
      );
    }
  }

  // ------------------------------------------------------------
  // Start
  // ------------------------------------------------------------

  init();
</script>

</body>
</html>
