<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NPB Predictor 手動日程管理</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:24px}
main{max-width:900px;margin:auto}
h1{color:#1e3a8a;font-size:1.35rem}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin:0 0 18px;box-shadow:0 2px 5px rgba(0,0,0,.03)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-size:.82rem;font-weight:700;color:#475569}
input,select{width:100%;box-sizing:border-box;margin-top:5px;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:.95rem}
button{border:0;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer;margin:6px 6px 0 0}
.primary{background:#2563eb;color:white}.sub{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}
pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px;overflow:auto;font-size:.78rem}
table{width:100%;border-collapse:collapse;font-size:.83rem}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#f8fafc}
.note{font-size:.82rem;line-height:1.6;color:#475569}
.status{padding:9px 12px;border-radius:8px;background:#eff6ff;color:#1e40af;font-weight:700;display:none;margin-top:10px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>NPB Predictor 手動日程管理</h1>
<div class="card">
<p class="note">
元の日程表に載っていない振替試合・追加日程は、ここで登録した内容を
<code>manual_schedule.json</code> として保存し、GitHub の main ブランチへ反映してください。
このページ自体からGitHubへ直接書き込む機能はありません。
</p>
<div class="grid">
<label>日付<input id="date" type="date"></label>
<label>状態<select id="status"><option value="scheduled">scheduled（未消化）</option><option value="finished">finished（結果あり）</option><option value="cancelled">cancelled（中止）</option></select></label>
<label>ホーム<input id="home" placeholder="例：阪神"></label>
<label>ビジター<input id="away" placeholder="例：広島"></label>
<label>ホーム先発<input id="home_starter" value="未定"></label>
<label>ビジター先発<input id="away_starter" value="未定"></label>
<label>ホーム得点（任意）<input id="home_score" type="number" min="0"></label>
<label>ビジター得点（任意）<input id="away_score" type="number" min="0"></label>
</div>
<div>
<button class="primary" onclick="addGame()">試合を追加</button>
<button class="sub" onclick="loadGames()">現在の入力を再読込</button>
</div>
<div id="statusBox" class="status"></div>
</div>

<div class="card">
<h2 style="font-size:1rem">登録予定</h2>
<table><thead><tr><th>日付</th><th>対戦</th><th>状態</th><th>先発</th><th>結果</th><th></th></tr></thead><tbody id="gameRows"></tbody></table>
</div>

<div class="card">
<h2 style="font-size:1rem">manual_schedule.json</h2>
<p class="note">下の内容をコピーして、リポジトリの <code>manual_schedule.json</code> に貼り付けてコミットしてください。</p>
<button class="primary" onclick="copyJson()">JSONをコピー</button>
<button class="sub" onclick="downloadJson()">JSONを保存</button>
<pre id="jsonOut">{"games":[]}</pre>
</div>
</main>
<script>
const TEAM_ALIASES={
"DeNA":"ＤｅＮＡ","横浜":"ＤｅＮＡ","横浜DeNA":"ＤｅＮＡ","横浜ＤｅＮＡ":"ＤｅＮＡ",
"阪神":"阪神","巨人":"巨人","広島":"広島","ヤクルト":"ヤクルト","中日":"中日",
"ソフトバンク":"ソフトバンク","日本ハム":"日本ハム","ロッテ":"ロッテ","楽天":"楽天","オリックス":"オリックス","西武":"西武"
};
let games=[];
function norm(x){x=(x||"").trim();return TEAM_ALIASES[x]||x}
function key(g){return [g.date,g.home,g.away].join("|")}
function setMsg(s){const b=document.getElementById("statusBox");b.textContent=s;b.style.display="block"}
function render(){
 const body=document.getElementById("gameRows");
 body.innerHTML="";
 games.sort((a,b)=>((a.date||"")+"|"+(a.home||"")+"|"+(a.away||"")).localeCompare((b.date||"")+"|"+(b.home||"")+"|"+(b.away||"")));
 games.forEach((g,i)=>{
   const tr=document.createElement("tr");
   tr.innerHTML="<td>"+esc(g.date)+"</td><td>"+esc(g.home)+" - "+esc(g.away)+"</td><td>"+esc(g.status)+"</td><td>"+esc(g.home_starter||"未定")+" / "+esc(g.away_starter||"未定")+"</td><td>"+((g.home_score!=null&&g.away_score!=null)?esc(g.home_score+"-"+g.away_score"):"-")+"</td><td><button class='danger' onclick='removeGame("+i+")'>削除</button></td>";
   body.appendChild(tr);
 });
 document.getElementById("jsonOut").textContent=JSON.stringify({games},null,2);
}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function addGame(){
 const date=document.getElementById("date").value;
 const home=norm(document.getElementById("home").value);
 const away=norm(document.getElementById("away").value);
 const status=document.getElementById("status").value;
 if(!date||!home||!away){setMsg("日付・ホーム・ビジターを入力してください。");return}
 if(home===away){setMsg("ホームとビジターは別球団にしてください。");return}
 const hs=document.getElementById("home_score").value;
 const as=document.getElementById("away_score").value;
 const g={date,home,away,status,home_starter:document.getElementById("home_starter").value.trim()||"未定",away_starter:document.getElementById("away_starter").value.trim()||"未定"};
 if(hs!==""&&as!==""){g.home_score=Number(hs);g.away_score=Number(as);g.status="finished"}
 if(g.status!=="finished"){delete g.home_score;delete g.away_score}
 const k=key(g);
 const idx=games.findIndex(x=>key(x)===k);
 if(idx>=0) games[idx]=g; else games.push(g);
 render();setMsg(idx>=0?"同一試合を更新しました。":"試合を追加しました。");
}
function removeGame(i){games.splice(i,1);render();setMsg("削除しました。")}
async function loadGames(){
 try{
  const r=await fetch("manual_schedule.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const d=await r.json(); games=Array.isArray(d)?d:(d.games||[]);
  render();setMsg("manual_schedule.json を読み込みました。");
 }catch(e){games=[];render();setMsg("既存ファイルを読めませんでした。新規入力として開始します。")}
}
async function copyJson(){
 await navigator.clipboard.writeText(JSON.stringify({games},null,2));
 setMsg("JSONをクリップボードへコピーしました。");
}
function downloadJson(){
 const blob=new Blob([JSON.stringify({games},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="manual_schedule.json";a.click();URL.revokeObjectURL(a.href);
 setMsg("manual_schedule.json を保存しました。");
}
loadGames();
</script>
</body>
</html>
